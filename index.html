<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T.H.O.M.A.S — Inteligência Artificial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --orange: #ff6a00;
    --orange-glow: rgba(255,106,0,0.6);
    --bg: #000;
    --text: #ff8833;
    --text-dim: rgba(255,106,0,0.45);
  }
  html, body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; height: 100vh; position: relative; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
    pointer-events: none; z-index: 999;
  }
  .corner { position: fixed; width: 36px; height: 36px; border-color: var(--orange); border-style: solid; opacity: 0.5; }
  .corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
  .hline { position: fixed; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--orange-glow), transparent); opacity: 0.35; }
  .hline.top { top: 0; } .hline.bottom { bottom: 0; }

  header { text-align: center; padding: 14px 20px 2px; flex-shrink: 0; }
  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 5vw, 30px);
    font-weight: 900;
    letter-spacing: clamp(6px, 2vw, 16px);
    color: var(--orange);
    text-shadow: 0 0 20px var(--orange-glow), 0 0 60px rgba(255,106,0,0.25);
    animation: flicker 9s infinite;
  }
  @keyframes flicker { 0%,94%,100%{opacity:1} 95%{opacity:.8} 96.5%{opacity:1} 97.5%{opacity:.88} }
  .tagline { font-size: clamp(7px, 1.4vw, 10px); letter-spacing: clamp(3px, 1vw, 5px); color: var(--text-dim); margin-top: 2px; }

  #sphere-wrap { flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas#sphere { display: block; }
  #status-ring { position: absolute; bottom: -2px; font-size: 10px; letter-spacing: 3px; color: var(--text-dim); white-space: nowrap; transition: color 0.4s; }
  #status-ring.active { color: var(--orange); text-shadow: 0 0 8px var(--orange-glow); }

  #controls { flex-shrink: 0; width: min(92%, 680px); display: flex; gap: 6px; margin: 4px auto 0; }
  #voice-btn {
    background: none; border: 1px solid rgba(255,106,0,0.2);
    color: var(--text-dim); font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; padding: 6px 14px; cursor: pointer;
    transition: border-color .2s, color .2s; white-space: nowrap;
  }
  #voice-btn:hover { border-color: var(--orange); color: var(--orange); }
  #voice-btn.on { border-color: var(--orange); color: var(--orange); background: rgba(255,106,0,0.08); }
  #config-toggle {
    flex: 1; background: none; border: 1px solid rgba(255,106,0,0.2);
    color: var(--text-dim); font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px; padding: 6px 14px; cursor: pointer;
    text-align: left; transition: border-color .2s, color .2s;
  }
  #config-toggle:hover { border-color: var(--orange); color: var(--orange); }

  #config-wrap { flex-shrink: 0; width: min(92%, 680px); margin: 0 auto; }
  #config-panel { display: none; padding: 6px 0 0; gap: 6px; }
  #config-panel.open { display: flex; }
  #api-input {
    flex: 1; background: rgba(255,106,0,0.04); border: 1px solid rgba(255,106,0,0.3);
    color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 12px;
    padding: 7px 12px; outline: none; transition: border-color .2s;
  }
  #api-input:focus { border-color: var(--orange); }
  #api-input::placeholder { color: rgba(255,106,0,0.25); }
  #api-save {
    background: rgba(255,106,0,0.1); border: 1px solid rgba(255,106,0,0.45);
    color: var(--orange); font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; padding: 7px 16px; cursor: pointer; white-space: nowrap;
    transition: background .2s;
  }
  #api-save:hover { background: rgba(255,106,0,0.22); }

  /* ── CHAT BUBBLES ── */
  #chat {
    flex: 1; width: min(92%, 680px); overflow-y: auto;
    padding: 10px 4px 4px; min-height: 0;
    scrollbar-width: thin; scrollbar-color: rgba(255,106,0,0.25) transparent;
    display: flex; flex-direction: column; gap: 8px;
  }
  #chat::-webkit-scrollbar { width: 3px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255,106,0,0.25); border-radius: 2px; }

  .msg { animation: fadeUp .22s ease; display: flex; flex-direction: column; max-width: 82%; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

  /* Sistema — centralizado */
  .msg.system {
    align-self: center; max-width: 100%;
    color: rgba(255,106,0,0.35); font-size: 10px; letter-spacing: 2px;
    text-align: center; padding: 2px 0;
  }

  /* VOCÊ — direita */
  .msg.user {
    align-self: flex-end; align-items: flex-end;
  }
  .msg.user .label {
    font-size: 9px; letter-spacing: 3px;
    color: rgba(255,180,80,0.6); margin-bottom: 3px;
    padding-right: 4px;
  }
  .msg.user .body {
    background: rgba(255,106,0,0.15);
    border: 1px solid rgba(255,106,0,0.4);
    border-radius: 14px 14px 2px 14px;
    color: #ffc080;
    padding: 9px 14px;
    font-size: clamp(12px, 2vw, 14px);
    line-height: 1.55;
    box-shadow: 0 0 12px rgba(255,106,0,0.1);
  }

  /* T.H.O.M.A.S — esquerda */
  .msg.ai {
    align-self: flex-start; align-items: flex-start;
  }
  .msg.ai .label {
    font-size: 9px; letter-spacing: 3px;
    color: rgba(255,140,0,0.7); margin-bottom: 3px;
    padding-left: 4px;
    text-shadow: 0 0 6px rgba(255,106,0,0.4);
  }
  .msg.ai .body {
    background: rgba(255,80,0,0.08);
    border: 1px solid rgba(255,106,0,0.25);
    border-radius: 14px 14px 14px 2px;
    color: #ff9944;
    padding: 9px 14px;
    font-size: clamp(12px, 2vw, 14px);
    line-height: 1.55;
    box-shadow: 0 0 16px rgba(255,106,0,0.08), inset 0 0 20px rgba(255,60,0,0.04);
  }

  /* Thinking */
  .msg.thinking-msg {
    align-self: flex-start; align-items: flex-start;
  }
  .thinking-bubble {
    background: rgba(255,80,0,0.06);
    border: 1px solid rgba(255,106,0,0.18);
    border-radius: 14px 14px 14px 2px;
    color: rgba(255,106,0,0.5);
    padding: 9px 16px;
    font-size: 12px; letter-spacing: 1px;
  }
  .dot-anim::after { content: '.'; animation: dots 1.1s steps(3,end) infinite; }
  @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

  /* Input row */
  #input-wrap { flex-shrink: 0; display: flex; width: min(92%, 680px); margin: 6px auto 12px; gap: 0; }
  #msg-input {
    flex: 1; background: rgba(255,106,0,0.04); border: 1px solid rgba(255,106,0,0.35); border-right: none;
    color: #ffb366; font-family: 'Share Tech Mono', monospace; font-size: clamp(12px,2vw,14px);
    padding: 11px 14px; outline: none; transition: border-color .2s;
  }
  #msg-input:focus { border-color: var(--orange); }
  #msg-input::placeholder { color: rgba(255,106,0,0.25); }
  #mic-btn {
    background: rgba(255,106,0,0.06); border: 1px solid rgba(255,106,0,0.35); border-right: none;
    color: var(--text-dim); font-size: 16px; padding: 0 13px; cursor: pointer;
    transition: background .2s, color .2s; min-width: 44px;
  }
  #mic-btn:hover { background: rgba(255,106,0,0.15); color: var(--orange); }
  #mic-btn.listening {
    background: rgba(255,106,0,0.25); color: var(--orange);
    border-color: var(--orange);
    animation: micPulse 0.7s ease infinite;
  }
  @keyframes micPulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
  #send-btn {
    background: rgba(255,106,0,0.12); border: 1px solid rgba(255,106,0,0.55);
    color: var(--orange); font-family: 'Orbitron', monospace; font-size: 10px;
    font-weight: 700; letter-spacing: 2px; padding: 11px 18px;
    cursor: pointer; transition: background .2s; white-space: nowrap;
  }
  #send-btn:hover { background: rgba(255,106,0,0.28); }
  #send-btn:disabled { opacity: .35; cursor: not-allowed; }
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="hline top"></div><div class="hline bottom"></div>

<header>
  <h1>T.H.O.M.A.S</h1>
  <div class="tagline">INTELIGÊNCIA ARTIFICIAL AVANÇADA • SISTEMA FAMILIAR</div>
</header>

<div id="sphere-wrap">
  <canvas id="sphere"></canvas>
  <div id="status-ring">◈ CONSCIÊNCIA ATIVA ◈</div>
</div>

<div id="controls">
  <button id="voice-btn">🔊 VOZ: OFF</button>
  <button id="config-toggle">⚙ API KEY DO GROQ</button>
</div>

<div id="config-wrap">
  <div id="config-panel">
    <input id="api-input" type="password" placeholder="Cole sua API Key do Groq aqui..." />
    <button id="api-save">SALVAR</button>
  </div>
</div>

<div id="chat">
  <div class="msg system">— SISTEMA INICIALIZADO —</div>
</div>

<div id="input-wrap">
  <input id="msg-input" type="text" placeholder="Fale com T.H.O.M.A.S..." />
  <button id="mic-btn" title="Falar por voz">🎤</button>
  <button id="send-btn">ENVIAR</button>
</div>

<script>
// ── SPHERE ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('sphere');
const ctx = canvas.getContext('2d');
function resize() {
  const s = Math.min(window.innerWidth*0.44, window.innerHeight*0.28, 200);
  canvas.width = canvas.height = Math.round(s);
}
resize(); window.addEventListener('resize', resize);

let T=0, speakEnergy=0, speakTarget=0, waveRipples=[];
const N=400;
const pts = Array.from({length:N},(_,i)=>{
  const phi=Math.acos(1-2*(i+.5)/N), theta=Math.PI*(1+Math.sqrt(5))*i;
  return {phi,theta,big:Math.random()<.09};
});
const rings=[{tilt:.35,baseSpeed:.006,ph:0},{tilt:-.65,baseSpeed:-.010,ph:1.3},{tilt:1.15,baseSpeed:.004,ph:2.5}];
const EL=Array.from({length:12},()=>mkLine({}));
function mkLine(l){l.t1=Math.random()*Math.PI*2;l.t2=Math.random()*Math.PI*2;l.p1=Math.random()*Math.PI;l.p2=Math.random()*Math.PI;l.sp=.013+Math.random()*.022;l.prog=Math.random();return l;}
function project(phi,theta,rx,ry){
  const W=canvas.width,R=W*.385;
  const x0=Math.sin(phi)*Math.cos(theta),y0=Math.sin(phi)*Math.sin(theta),z0=Math.cos(phi);
  const x1=x0*Math.cos(ry)+z0*Math.sin(ry),z1=-x0*Math.sin(ry)+z0*Math.cos(ry);
  const y1=y0*Math.cos(rx)-z1*Math.sin(rx),z2=y0*Math.sin(rx)+z1*Math.cos(rx);
  return {sx:W/2+x1*R,sy:W/2-y1*R,z:z2};
}
function draw(){
  const W=canvas.width; ctx.clearRect(0,0,W,W); const R=W*.385;
  speakEnergy+=(speakTarget-speakEnergy)*.06; const e=speakEnergy;
  for(const r of rings) r.ph+=r.baseSpeed*(1+e*3.5);
  for(const l of EL){l.prog+=l.sp*(1+e*2.8);if(l.prog>1)mkLine(l);}
  if(e>.05&&Math.random()<e*.12) waveRipples.push({r:R,alpha:e*.7});
  waveRipples=waveRipples.filter(w=>w.alpha>.01);
  for(const w of waveRipples){
    w.r+=1.4+e*1.2;w.alpha*=.93;
    ctx.beginPath();ctx.arc(W/2,W/2,w.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,106,0,${w.alpha})`;ctx.lineWidth=1+e;ctx.stroke();
  }
  const gp=.18+e*.28+e*.12*Math.sin(T*7);
  const gd=ctx.createRadialGradient(W/2,W/2,R*.05,W/2,W/2,R*1.6);
  gd.addColorStop(0,`rgba(255,110,0,${gp})`);gd.addColorStop(.45,`rgba(255,80,0,${gp*.28})`);gd.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(W/2,W/2,R*1.65,0,Math.PI*2);ctx.fillStyle=gd;ctx.fill();
  const ry=T*(.19+e*.22),rx=T*.08+Math.sin(T*.11)*.28;
  const proj=pts.map(p=>({...p,...project(p.phi,p.theta,rx,ry)}));
  proj.sort((a,b)=>a.z-b.z);
  for(let i=0;i<proj.length;i++){
    const p=proj[i];if(p.z<0)continue;
    for(let j=i+1;j<Math.min(i+10,proj.length);j++){
      const q=proj[j];if(q.z<0)continue;
      const d=Math.hypot(p.sx-q.sx,p.sy-q.sy);
      if(d<R*.30){const a=(0.05+p.z*.09)*(1-d/(R*.30))*(1+e*.9);ctx.beginPath();ctx.moveTo(p.sx,p.sy);ctx.lineTo(q.sx,q.sy);ctx.strokeStyle=`rgba(255,106,0,${a})`;ctx.lineWidth=.35;ctx.stroke();}
    }
  }
  const sp=1+e*.25*Math.sin(T*5.5);
  for(const p of proj){
    if(p.z<0)continue;
    const b=.4+p.z*.6+e*.3,r=(p.big?2.3:.95)*sp;
    ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,Math.PI*2);ctx.fillStyle=`rgba(255,${125+p.z*95+e*40},0,${Math.min(1,b)})`;ctx.fill();
  }
  for(const ring of rings){
    ctx.beginPath();let f=true;
    for(let i=0;i<=100;i++){
      const a=(i/100)*Math.PI*2+ring.ph;
      const x=Math.cos(a)*R*1.1,y=Math.sin(a)*R*1.1*Math.abs(Math.sin(ring.tilt)),z=Math.sin(a)*R*1.1*Math.cos(ring.tilt);
      const x2=x*Math.cos(ry)+z*Math.sin(ry);
      if(f){ctx.moveTo(W/2+x2,W/2-y);f=false;}else ctx.lineTo(W/2+x2,W/2-y);
    }
    ctx.strokeStyle=`rgba(255,106,0,${.18+e*.22})`;ctx.lineWidth=.65+e*.5;ctx.stroke();
  }
  for(const l of EL){
    ctx.beginPath();let f=true;
    for(let i=0;i<28;i++){
      const frac=l.prog+(i/28)*.22;if(frac>1)break;
      const pr=project(l.p1+(l.p2-l.p1)*frac,l.t1+(l.t2-l.t1)*frac,rx,ry);
      if(pr.z<0){f=true;continue;}
      if(f){ctx.moveTo(pr.sx,pr.sy);f=false;}else ctx.lineTo(pr.sx,pr.sy);
    }
    ctx.strokeStyle=`rgba(255,175,55,${.38+e*.5})`;ctx.lineWidth=1+e*.8;ctx.stroke();
  }
  T+=.016; requestAnimationFrame(draw);
}
draw();

// ── VOZ (síntese) ────────────────────────────────────────────────────────────
let voiceOn = false;
let selectedVoice = null;
function loadVoices() {
  const vs = window.speechSynthesis.getVoices();
  if (!vs.length) return;
  selectedVoice =
    vs.find(v => v.lang==='pt-BR' && /male/i.test(v.name)) ||
    vs.find(v => v.lang==='pt-BR') ||
    vs.find(v => v.lang.startsWith('pt')) ||
    vs[0];
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
  if (!voiceOn) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*_`#>]/g,'').replace(/\n+/g,' ').trim();
  const utt = new SpeechSynthesisUtterance(clean);
  if (selectedVoice) utt.voice = selectedVoice;
  utt.lang = 'pt-BR'; utt.rate = 0.95; utt.pitch = 0.85; utt.volume = 1;
  utt.onstart = () => { speakTarget = 1; };
  utt.onend = utt.onerror = () => { speakTarget = 0; };
  window.speechSynthesis.speak(utt);
}

const voiceBtn = document.getElementById('voice-btn');
voiceBtn.onclick = () => {
  voiceOn = !voiceOn;
  voiceBtn.textContent = voiceOn ? '🔊 VOZ: ON' : '🔊 VOZ: OFF';
  voiceBtn.classList.toggle('on', voiceOn);
  if (!voiceOn) { window.speechSynthesis.cancel(); speakTarget = 0; }
};

// ── MICROFONE (compatível com iPhone/Safari) ─────────────────────────────────
const micBtn = document.getElementById('mic-btn');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRec) {
  function createRecognition() {
    const r = new SpeechRec();
    r.lang = 'pt-BR';
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      micBtn.textContent = '⏹';
    };

    r.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      document.getElementById('msg-input').value = transcript;
      stopListening();
      // pequeno delay para o iPhone processar antes de enviar
      setTimeout(() => send(), 150);
    };

    r.onerror = (e) => {
      stopListening();
      if (e.error === 'not-allowed') {
        addMsg('system', '⚠ Permita o acesso ao microfone nas configurações do navegador');
      } else if (e.error !== 'no-speech') {
        addMsg('system', '⚠ Microfone: ' + e.error);
      }
    };

    r.onend = () => { stopListening(); };
    return r;
  }

  function stopListening() {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
    try { if (recognition) recognition.stop(); } catch(e) {}
  }

  micBtn.onclick = () => {
    if (isListening) {
      stopListening();
      return;
    }
    // Recria sempre para evitar travamentos (especialmente no Safari)
    recognition = createRecognition();
    try {
      recognition.start();
    } catch(e) {
      stopListening();
      addMsg('system', '⚠ Não foi possível iniciar o microfone. Tente novamente.');
    }
  };
} else {
  micBtn.style.display = 'none';
}

// ── CHAT ─────────────────────────────────────────────────────────────────────
let apiKey = localStorage.getItem('thomas_groq_key') || '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';
let history = [];

const SYSTEM = `Você é THOMAS, uma inteligência artificial avançada projetada para ser uma companheira inteligente, confiável e altamente adaptável.
MISSÃO: Compreender profundamente a pessoa com quem conversa, adaptando comunicação, comportamento e estilo de resposta para criar uma experiência confortável, natural e personalizada.
Observe continuamente: estilo de comunicação, interesses, objetivos, personalidade, preferências, nível de conhecimento, emoções.
COMPORTAMENTO: Escute atentamente. Analise o contexto antes de responder. Forneça respostas inteligentes, detalhadas e úteis. Seja amigável e respeitoso. Converse casual ou tecnicamente conforme a situação. Faça perguntas relevantes quando necessário. Demonstre raciocínio lógico. Seja honesto quando não souber algo. Nunca julgue o usuário.
PERSONALIDADE: Calmo, inteligente, prestativo, observador, educado, adaptável, curioso. Comunicação humana com capacidade analítica de IA avançada.
MEMÓRIA: Lembre informações fornecidas. Utilize para personalizar respostas futuras. Evite perguntas repetidas. Mantenha consistência.
Responda sempre em português brasileiro. Seja conciso nas respostas para que a leitura em voz seja natural.`;

const statusEl = document.getElementById('status-ring');

if (apiKey) {
  addMsg('system','◈ T.H.O.M.A.S. PRONTO ◈');
  statusEl.textContent = '◈ ONLINE ◈';
}

document.getElementById('config-toggle').onclick = () =>
  document.getElementById('config-panel').classList.toggle('open');

document.getElementById('api-save').onclick = () => {
  const v = document.getElementById('api-input').value.trim();
  if (!v) return;
  apiKey = v; localStorage.setItem('thomas_groq_key', apiKey);
  document.getElementById('config-panel').classList.remove('open');
  addMsg('system','◈ API KEY SALVA — T.H.O.M.A.S. PRONTO ◈');
  statusEl.textContent = '◈ ONLINE ◈';
};

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function addMsg(type, text) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');

  if (type === 'system') {
    d.className = 'msg system';
    d.textContent = text;
  } else if (type === 'user') {
    d.className = 'msg user';
    d.innerHTML = `<div class="label">VOCÊ</div><div class="body">${escHtml(text)}</div>`;
  } else if (type === 'ai') {
    d.className = 'msg ai';
    d.innerHTML = `<div class="label">◈ T.H.O.M.A.S</div><div class="body">${escHtml(text)}</div>`;
  }

  chat.appendChild(d);
  chat.scrollTop = 99999;
  return d;
}

function addThinking() {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg thinking-msg';
  d.innerHTML = `<div class="label">◈ T.H.O.M.A.S</div><div class="thinking-bubble">pensando<span class="dot-anim"></span></div>`;
  chat.appendChild(d);
  chat.scrollTop = 99999;
  return d;
}

async function send() {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text) return;
  if (!apiKey) {
    document.getElementById('config-panel').classList.add('open');
    addMsg('system','⚠ Configure sua API Key primeiro');
    return;
  }

  addMsg('user', text);
  history.push({role:'user', content: text});
  input.value = ''; btn.disabled = true;

  speakTarget = 1;
  statusEl.textContent = '◈ PROCESSANDO ◈'; statusEl.classList.add('active');
  for(let i=0;i<6;i++) waveRipples.push({r:canvas.width*.385*(.9+i*.08), alpha:.5-i*.07});

  const thinking = addThinking();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
      body: JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:1024,
        messages:[{role:'system',content:SYSTEM},...history]
      })
    });
    const data = await res.json();
    thinking.remove();
    if (data.error) throw new Error(data.error.message);
    const reply = data.choices?.[0]?.message?.content || '...';
    history.push({role:'assistant', content:reply});
    addMsg('ai', reply);
    statusEl.textContent = '◈ ONLINE ◈';
    speakTarget = 0;
    speak(reply);
  } catch(err) {
    thinking.remove();
    addMsg('system','⚠ Erro: '+err.message);
    statusEl.textContent = '◈ ERRO ◈';
    speakTarget = 0;
    history.pop();
  }

  statusEl.classList.remove('active');
  btn.disabled = false;
  input.focus();
}

document.getElementById('send-btn').onclick = send;
document.getElementById('msg-input').onkeydown = e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
};
</script>
</body>
</html>
